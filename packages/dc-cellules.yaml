# =============================================================================
# TENSIONS DE CELLULES - 16 par pack
# =============================================================================
# PAQUET inclus par docan.yaml. Ne se compile pas seul.
# Alimentees par les scripts p1_analog et p2_analog.
#
# CONVENTION : qualificatif en SUFFIXE - "Cellule 01 Pack1". Les deux packs se
# retrouvent ainsi cote a cote pour chaque rang de cellule dans les listes
# triees par nom.
#
# Toutes en diagnostic : au quotidien ce sont "Cellule Min", "Cellule Max" et
# surtout "Delta Cellules" qu'on regarde. Le detail par cellule sert quand le
# delta se degrade - il designe alors la coupable.
#
# REPERE : au 26/08/2026, le pack 1 au repos tenait 3.328 a 3.331 V, soit
# 3 mV d'ecart sur seize cellules. Excellent equilibrage. Une derive vers
# plusieurs dizaines de mV serait le premier signe d'une cellule fatiguee.
# =============================================================================

sensor:

  - platform: template
    name: "${upper_devicename} Cellule 01 Pack1"
    id: p1c01
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never

